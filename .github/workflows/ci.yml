name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make check
      - run: make build VERSION=ci
      - name: Check command-line interface without a project
        run: |
          executable="$PWD/lazyxcode"
          cd "$RUNNER_TEMP"
          "$executable" --help
          test "$("$executable" --version)" = "lazyxcode ci"
  legacy-smoke:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.3.app/Contents/Developer
      LAZYXCODE_RELEASE_SMOKE: '1'
      LAZYXCODE_SMOKE_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-18-4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install the runtime matching Xcode 16.3
        run: |
          sudo xcode-select --switch "$DEVELOPER_DIR"
          # Warm up CoreSimulator before downloading (runner-images#12862).
          xcrun simctl list > /dev/null
          xcodebuild -downloadPlatform iOS -buildVersion 18.4
      - run: go test ./internal/xcode -run '^TestReleaseSmoke$' -v -count=1 -timeout 15m
  package:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-homebrew.sh
