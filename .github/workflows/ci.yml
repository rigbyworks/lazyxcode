name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make check
      - run: make build VERSION=ci
      - name: Check command-line interface without a project
        run: |
          executable="$PWD/lazyxcode"
          cd "$RUNNER_TEMP"
          "$executable" --help
          test "$("$executable" --version)" = "lazyxcode ci"
  legacy-smoke:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.3.app/Contents/Developer
      LAZYXCODE_RELEASE_SMOKE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./internal/xcode -run '^TestReleaseSmoke$' -v -count=1 -timeout 15m
  package:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-homebrew.sh
