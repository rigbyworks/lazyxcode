name: Release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag to retry
        required: true
permissions:
  contents: read
jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: xcode-27
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Validate release tag
        shell: bash
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Verify released commit belongs to main
        run: git merge-base --is-ancestor HEAD origin/main
      - run: swift --version
      - run: make check
      - run: make build VERSION="$RELEASE_TAG"
      - run: test "$(./lazyxcode --version)" = "lazyxcode $RELEASE_TAG"
      - name: Open tap update PR
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          gh auth setup-git
          bash scripts/update-homebrew.sh "$RELEASE_TAG"
