name: Feature request
description: Suggest a new feature or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the workflow or problem. What do you do today, and where does it get in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like lazyxcode to do?
      description: Include keybindings or layout ideas if you have them.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've tried
